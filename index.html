<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<meta name="robots" content="noindex, nofollow">
<title>언어 학습노트</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lang.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head"><b>목차</b><button class="icon-btn" id="side-close" title="목차 닫기">✕</button></div>
    <nav id="side-nav"></nav>
    <div class="side-foot">
      <span id="sync-state"></span>
      <button id="btn-export" title="학습 기록을 파일로 저장">백업 저장</button>
      <button id="btn-import" title="백업 파일에서 불러오기">백업 불러오기</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </div>
  </aside>
  <div id="center">
    <header id="topbar">
      <button class="icon-btn" id="side-toggle" title="목차 열기/닫기">☰</button>
      <div class="crumb" id="crumb"></div>
      <button class="icon-btn" onclick="location.hash='#home'" title="언어 선택">홈</button>
    </header>
    <main id="main"></main>
    <nav id="tabbar" hidden></nav>
  </div>
</div>
<div id="toast"></div>

<script src="js/content.js"></script>
<script src="js/store.js"></script>
<script src="js/draw.js"></script>
<script src="js/lang.js"></script>
</body>
</html>
